name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'doc')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Get latest assets tag
        run: |
          source .env.production

          TAG=$(
            git ls-remote --tags --refs https://github.com/$REPO.git \
            | awk '{print $2}' \
            | sed 's|refs/tags/||' \
            | sort -V \
            | tail -n1
          )

          echo "Latest tag: $TAG"
          
          if grep -q "^TAG=" .env.production; then
            sed -i "s|^TAG=.*|VITE_ASSETS_BASE_URL=$TAG|" .env.production
          else
            echo "TAG=$TAG" >> .env.production
          fi

          cat .env.production 

      - name: Install dependencies
        run: npm i

      - name: Build
        run: npm run build

      - name: Upload artifact 📤
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4